                                                                            
                                                                             
                                                                             
[package]
name = "mango-v4"
version = "0.25.0"
edition = "2021"
rust-version = "1.68"

[lib]
name = "mango_v4"
path = "../../../programs/mango-v4/src/lib.rs"
crate-type = ["lib"]
doctest = false

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = ["custom-heap"]
enable-gpl = []
custom-heap = []
legacy-spot = []
token-conditional-swaps = []
legacy-queues = []
legacy-unit-tests = []
legacy-queue-tests = []
client = ["solana-sdk", "no-entrypoint"]
test-bpf = ["client"]

[dependencies]
anchor-lang = "=0.28.0"
anchor-spl = "=0.28.0"
arrayref = "0.3.6"
bincode = "1.3.3"
borsh = { version = "0.10.3", features = ["const-generics"] }
bytemuck = { version = "=1.14.0", features = ["min_const_generics"] }
default-env = "0.1.1"
derivative = "2.2.0"
fixed = { git = "https://github.com/blockworks-foundation/fixed.git", rev = "01516ae3e29418feb066b67830540aa81d04df05", features = ["serde", "borsh", "debug-assert-in-release"] }
num_enum = "0.5.1"
serde = "1.0"
solana-address-lookup-table-program = "=1.16.14"
solana-program = "=1.16.14"
solana-sdk = { version = "=1.16.14", default-features = false, optional = true }
solana-security-txt = "1.1.0"
static_assertions = "1.1"
